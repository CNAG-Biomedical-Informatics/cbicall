workdir: examples/input
workflow_log: bash_gatk-3.5_mit_single_rsrs.log
run:
  parameter_file: mit_single.yaml
  base_dir: CNAG999_exome/CNAG99901P_ex
  run_glob: cbicall_bash_gatk-3.5_mit_single_rsrs_*
required_files:
  - log.json
  - run-report.json
  - run-report.html
  - bash_gatk-3.5_mit_single_rsrs.log
  - 01_mtoolbox/mit_prioritized_variants.txt
  - 01_mtoolbox/mit.filtered.json
  - 02_browser/README.txt
required_globs:
  - 02_browser/*.html
json_expectations:
  - path: status
    equals: success
  - path: workflow.backend
    equals: bash
  - path: workflow.pipeline
    equals: mit
  - path: workflow.mode
    equals: single
  - path: workflow.software_stack
    equals: gatk-3.5
  - path: workflow.registry_version
    equals: v1
  - path: resources.bundle.key
    equals: cbicall-germline-resources-v1
  - path: run.display_genome
    equals: rsrs
hashes:
  - name: mit_prioritized_variants
    type: normalized_text
    path: 01_mtoolbox/mit_prioritized_variants.txt
    pattern: ^#
    records: 1087
    sha256: 7dbb903f52c7394c6caf75bc8ad66746f27a7dec063f35c29564708504a92f66
  - name: mit_filtered_json
    type: canonical_json
    path: 01_mtoolbox/mit.filtered.json
