workdir: examples/input
workflow_log: bash_gatk-3.5_mit_single_rsrs.log
run:
  parameter_file: mit_single.yaml
  base_dir: CNAG999_exome/CNAG99901P_ex
  run_glob: cbicall_bash_gatk-3.5_mit_single_rsrs_*
required_files:
  - log.json
  - run-report.json
  - run-report.html
  - bash_gatk-3.5_mit_single_rsrs.log
  - 01_mtoolbox/mit_prioritized_variants.txt
  - 01_mtoolbox/mit.filtered.json
  - 02_browser/README.txt
required_globs:
  - 02_browser/*.html
json_expectations:
  - path: status
    equals: success
  - path: workflow.backend
    equals: bash
